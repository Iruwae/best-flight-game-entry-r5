<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Fjord — a dusk flight game</title>
<link rel="stylesheet" href="./style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
  { "imports": { "ez-tree": "./vendor/ez-tree.min.js", "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Ember Fjord: fly the jet through the glowing rings, slalom the peaks, or land on runway 18"></canvas>
<div class="vignette" aria-hidden="true"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
